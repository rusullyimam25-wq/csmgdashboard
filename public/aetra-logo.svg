<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%">
  <defs>
    <!-- Orange Hands Gradient -->
    <linearGradient id="aetraOrangeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E85814"/>
      <stop offset="60%" stop-color="#F37021"/>
      <stop offset="100%" stop-color="#F99B28"/>
    </linearGradient>

    <!-- Blue Figure Gradient -->
