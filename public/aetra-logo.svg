    <path d="M72,-30 C70,-14 58,10 40,26 C22,42 8,60 3,93 C8,88 18,74 26,58 C38,36 58,15 72,-8 C77,-19 75,-27 72,-30 Z" fill="url(#aetraOrangeGrad)"/>
    <path d="M78,-16 C54,18 28,48 3,95 C7,68 26,38 52,10 C68,-6 76,-13 78,-16 Z" fill="#F37021"/>

