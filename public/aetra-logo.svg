      <stop offset="0%" stop-color="#004A8B"/>
      <stop offset="100%" stop-color="#0066B3"/>
    </linearGradient>

    <!-- Corporate Blue Solid -->
    <style>
      .aetra-blue { fill: #0054A6; }
      .aetra-blue-sub { fill: #0054A6; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

